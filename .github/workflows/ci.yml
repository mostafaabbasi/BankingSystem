name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore BankingSystem.sln

      - name: Build
        run: dotnet build BankingSystem.sln --no-restore --configuration Release

      - name: Unit Tests
        run: dotnet test tests/BankingSystem.UnitTests --no-build --configuration Release --verbosity normal

      - name: Integration Tests
        run: dotnet test tests/BankingSystem.IntegrationTests --no-build --configuration Release --verbosity normal
